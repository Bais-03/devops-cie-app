apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cie-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-cie-app
  template:
    metadata:
      labels:
        app: devops-cie-app
    spec:
      containers:
        - name: devops-cie-app
          image: devops-cie-app:4
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
